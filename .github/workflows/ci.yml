# verify: on pull requests and pushes to main, ./verify.sh, with the browser
#   tests' screenshots kept as the e2e-results artifact.
# deploy: on pushes to main, build the image, push it to ECR and run it on
#   the AWS instance (rudnam/rudnam-infra). Also on demand from main: Actions
#   → CI → Run workflow with a commit SHA redeploys that commit (a rollback);
#   its image is reused from ECR, or rebuilt if ECR no longer has it.
#
# Third-party actions are pinned to commit SHAs, since the deploy job holds
# AWS credentials; Dependabot (.github/dependabot.yml) proposes updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (from the commit list on main)
        required: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Go tests' module and build caches, kept between runs so they
      # compile only what changed. A new key every run saves the updated
      # cache; restore-keys picks the newest one for the same go.sum and Go.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-mod
            ${{ runner.temp }}/go-build
          key: verify-go-${{ hashFiles('go.sum', 'Dockerfile') }}-${{ github.run_id }}
          restore-keys: verify-go-${{ hashFiles('go.sum', 'Dockerfile') }}-
      - run: ./verify.sh
        env:
          GO_MOD_CACHE: ${{ runner.temp }}/go-mod
          GO_BUILD_CACHE: ${{ runner.temp }}/go-build
      - name: Upload screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e/test-results/
          if-no-files-found: ignore

  # Signs in as the github-deploy IAM user (secrets AWS_ACCESS_KEY_ID and
  # AWS_SECRET_ACCESS_KEY), which can do nothing but assume the deploy role
  # for an hour. The role, and everything it can touch, is defined in
  # rudnam/rudnam-infra; the repo variables AWS_DEPLOY_ROLE_ARN and
  # DEPLOY_BUCKET come from its outputs.
  deploy:
    needs: verify
    # Runs only once the repo is set up for deploys (see rudnam-infra).
    if: >-
      always() && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' &&
      ((github.event_name == 'push' && needs.verify.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # One deploy at a time; a newer one waits rather than cancelling one
    # that's halfway through.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # The app's name in rudnam-infra: its ECR repository, its folder in the
      # deploy bucket and its Compose project on the instance (and so its
      # database volume). Fixed, not the repository name, so renaming the
      # repository can't break deploys; the deploy role may only touch this app.
      APP: app-template
      AWS_REGION: ap-southeast-2
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Check the commit SHA
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Not a full commit SHA: $SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # ECR tags are immutable, so an image that's already there is exactly
      # this commit's build.
      - name: Is the image already in ECR?
        id: image
        run: |
          if aws ecr describe-images --repository-name "$APP" --image-ids "imageTag=$SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ env.SHA }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.APP }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The instance runs exactly the Compose files of this commit.
      - name: Upload Compose files
        run: |
          dest="s3://${{ vars.DEPLOY_BUCKET }}/apps/$APP/$SHA"
          aws s3 cp docker-compose.yml "$dest/docker-compose.yml"
          aws s3 cp deploy/aws.yml "$dest/deploy/aws.yml"

      - name: Deploy on the instance
        run: |
          id=$(aws ssm send-command \
            --document-name rudnam-deploy \
            --targets Key=tag:Role,Values=apps \
            --parameters "App=$APP,Sha=$SHA" \
            --comment "$APP ${SHA::7} (run $GITHUB_RUN_ID)" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          while :; do
            sleep 10
            status=$(aws ssm list-command-invocations --command-id "$id" \
              --query 'CommandInvocations[0].Status' --output text)
            case $status in Pending|InProgress|Delayed|None) continue ;; esac
            break
          done
          aws ssm list-command-invocations --command-id "$id" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text | tail -20
          echo "status: $status"
          [ "$status" = Success ]
