# Expose the app with Caddy, which gets and renews a Let's Encrypt certificate.
# Needs DOMAIN and ACME_EMAIL in .env, a DNS A/AAAA record pointing at this
# machine, and inbound ports 80 and 443 open: a VPS, an EC2 instance, or any
# host with a public IP.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # certificates; keep it, or Caddy re-issues on every start
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
