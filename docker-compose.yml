# Core stack: the app and its PostgreSQL database. Provider-neutral.
#
# Where it runs is a layer in deploy/, chosen with COMPOSE_FILE:
#   deploy/local.yml  http://localhost:8080, for development (.env.example)
#   deploy/aws.yml    production on AWS, set by the deploy (see README.md)

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Built from this folder locally; production sets APP_IMAGE to the
    # commit's image in ECR.
    image: ${APP_IMAGE:-app-template:local}
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app?sslmode=disable
      # Defaults assume an HTTPS proxy in front (production);
      # deploy/local.yml overrides them for http://localhost.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      PUBLIC_ORIGIN: https://${DOMAIN:-localhost}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-}
      ANDROID_CERT_FINGERPRINTS: ${ANDROID_CERT_FINGERPRINTS:-}
      DEMO: ${DEMO:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    # No ports here; the deploy/ layer decides how traffic reaches the app.

volumes:
  pgdata:
